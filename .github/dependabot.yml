version: 2
# Weekly, grouped, quiet (owner, 2026-11-26: "not so damn much daily prs"): every ecosystem on
# Monday, minor+patch as ONE pull request per ecosystem, security updates batched into one more per
# ecosystem, majors individually, at most 3 open per ecosystem. The developerz.ai maintainer agent
# reviews them and merges on a green "CI OK"; it is the only merger (no auto-merge workflow).
#
# cooldown: a release must be 14 days old before it is proposed, so broken or
# compromised releases are usually yanked first. Security updates skip it.
#
# gemfiles/matrix.gemfile needs no entry: it has no lockfile and the CI matrix
# resolves the newest compatible gems on every run.
updates:
  - package-ecosystem: bundler
    directories:
      - /
      - /integration
      - /integration_mysql
      - /integration_sqlite
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      bundler-minor:
        update-types: ['minor', 'patch']
      bundler-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      actions-minor:
        update-types: ['minor', 'patch']
      actions-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    ignore:
      # ESLint 10: eslint-plugin-jsx-a11y and eslint-plugin-react peer-depend on eslint <=9 (npm ci
      # fails with ERESOLVE). Drop this once both publish a release that accepts 10.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
    groups:
      site-minor:
        update-types: ['minor', 'patch']
      site-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      docker-minor:
        update-types: ['minor', 'patch']
      docker-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      docker-compose-minor:
        update-types: ['minor', 'patch']
      docker-compose-security:
        applies-to: security-updates
        patterns: ['*']
