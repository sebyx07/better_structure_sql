# zizmor (workflow security) runs in CI's "Lint / workflows" job.
rules:
  adhoc-packages:
    ignore:
      # The package job installs the gem it just built, from the local file.
      - ci.yml
  self-repository:
    ignore:
      # actionlint 1.7.12 rejects the `$/` self-repository form; keep `./` until it accepts it.
      - release.yml
  unpinned-images:
    ignore:
      # The canary exists to run against the newest postgres image.
      - canary.yml
