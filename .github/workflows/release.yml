name: Release

# Merging a version bump is the release. When lib/better_structure_sql/version.rb
# changes on main and that version is not on RubyGems yet, this runs the full CI
# workflow, publishes the gem, then creates the tag v<VERSION> and the GitHub
# Release with the notes from CHANGELOG.md. Nobody tags or `gem push`es by hand.
# An existing RubyGems version is never pushed again; a run that published but
# failed before the GitHub Release is finished by a manual run
# (workflow_dispatch on main). That run does not trust main's head: it tags the
# commit that set VERSION and attaches the gem RubyGems serves. See RELEASE.md.
#
# Publishing uses RubyGems trusted publishing (OIDC), no API key secret:
# rubygems.org -> better_structure_sql -> Trusted publishers -> GitHub Actions,
# repository sebyx07/better_structure_sql, workflow release.yml, environment release.
on:
  push:
    branches: [main]
    paths: ['lib/better_structure_sql/version.rb']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Is v<VERSION> unreleased?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags, for the stray-tag check
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases run from main only (got $GITHUB_REF)."
            exit 1
          fi
          version=$(sed -nE "s/^ *VERSION = '([^']+)'.*/\1/p" lib/better_structure_sql/version.rb)
          if [ -z "$version" ]; then
            echo "::error::Could not read VERSION from lib/better_structure_sql/version.rb"
            exit 1
          fi
          # RubyGems prerelease form 1.0.0.rc1 becomes the git tag v1.0.0-rc1.
          tag="v$(echo "$version" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)\.(.+)$/\1-\2/')"

          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://rubygems.org/api/v2/rubygems/better_structure_sql/versions/$version.json")
          case "$status" in
            200) publish=false ;;
            404) publish=true ;;
            *) echo "::error::rubygems.org answered HTTP $status; re-run later."; exit 1 ;;
          esac

          if gh release view "$tag" >/dev/null 2>&1; then release=false; else release=true; fi

          # A tag that exists without a published gem must point at this commit,
          # or the release would publish one commit under another commit's tag.
          if [ "$publish" = true ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged=$(git rev-parse "refs/tags/$tag^{commit}")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already points at $tagged, not $GITHUB_SHA, and $version is not on RubyGems. Bump the version, or delete the stray tag."
              exit 1
            fi
          fi

          echo "version $version, tag $tag, publish to RubyGems: $publish, create GitHub Release: $release"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
      - name: CHANGELOG.md has notes for this version
        if: steps.v.outputs.release == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: .github/scripts/changelog-notes.sh "$VERSION" > /dev/null

  verify:
    name: Verify
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ needs.version.outputs.tag }} to RubyGems
    needs: [version, verify]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # RubyGems trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Bundler and no dependency cache in the job that holds the OIDC token:
      # `gem build` needs only the gemspec, and a cache written by a PR job
      # must never be restored here.
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler: none
      - name: Exchange the OIDC token for RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      # The gem goes first: a tag or a GitHub Release with no gem behind it
      # would advertise a version `gem install` cannot serve.
      - name: Build and push the gem
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gem build better_structure_sql.gemspec --strict
          gem push "better_structure_sql-$VERSION.gem"

  github-release:
    name: Tag + GitHub Release ${{ needs.version.outputs.tag }}
    needs: [version, publish]
    # Also runs when the gem was already published (a re-run finishing a
    # release whose GitHub step failed), but never after a failed publish.
    if: >-
      always() && needs.version.result == 'success' &&
      needs.version.outputs.release == 'true' &&
      (needs.publish.result == 'success' ||
       (needs.publish.result == 'skipped' && needs.version.outputs.publish == 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the tag + GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # history and tags, to find the commit that set VERSION
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler: none
      - name: Create the tag and the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          version_file=lib/better_structure_sql/version.rb
          if [ "$PUBLISH_RESULT" = success ]; then
            # This run built and pushed the gem from this commit.
            target="$GITHUB_SHA"
            gem build better_structure_sql.gemspec --strict
          else
            # Finishing an earlier release: main may have moved on since. Tag the
            # newest commit that set this VERSION, and attach the gem RubyGems
            # serves instead of rebuilding one from a different tree.
            target=$(git log -1 --format=%H -S"VERSION = '$VERSION'" -- "$version_file")
            if [ -z "$target" ]; then
              echo "::error::No commit on main sets VERSION = '$VERSION' in $version_file."
              exit 1
            fi
            at_target=$(git show "$target:$version_file" | sed -nE "s/^ *VERSION = '([^']+)'.*/\1/p")
            if [ "$at_target" != "$VERSION" ]; then
              echo "::error::$target has VERSION '$at_target', expected '$VERSION'. Create the release by hand: RELEASE.md."
              exit 1
            fi
            gem fetch better_structure_sql --version "$VERSION" --clear-sources --source https://rubygems.org
          fi
          # gh would silently reuse an existing tag and ignore --target.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tagged=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$tagged" != "$target" ]; then
              echo "::error::Tag $TAG already points at $tagged, not $target."
              exit 1
            fi
          fi
          echo "releasing $TAG at $target"
          .github/scripts/changelog-notes.sh "$VERSION" > release-notes.md
          prerelease=()
          case "$VERSION" in *[a-zA-Z]*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" "better_structure_sql-$VERSION.gem" \
            --title "$TAG" --target "$target" --notes-file release-notes.md "${prerelease[@]}"
